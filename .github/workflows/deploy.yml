name: CI/CD - Deploy DevOpsVaultX Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Checkout Code
      - name: Stage 1 - Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Setup Runtime Environment
      - name: Stage 2 - Setup Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stage 3: Install Dependencies
      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Stage 3 - Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Stage 4: Validate / Lint
      - name: Stage 4 - Validate / Lint
        run: |
          echo "Validating MkDocs configuration and Markdown syntax..."
          NO_MKDOCS_2_WARNING=1 mkdocs build --strict

      # Stage 5: Build Documentation
      - name: Stage 5 - Build Documentation
        run: |
          echo "Building production-ready static assets..."
          NO_MKDOCS_2_WARNING=1 mkdocs build --clean --strict

      # Stage 6: SEO & Link Validation
      - name: Stage 6 - SEO & Link Validation
        run: |
          echo "Running SEO, Sitemap, Robots, and Asset Link validations..."
          python scripts/validate_seo.py

      # Stage 7: Deploy to GitHub Pages
      - name: Stage 7 - Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          NO_MKDOCS_2_WARNING=1 mkdocs gh-deploy --force

      # Post-Deployment Status Report
      - name: Generate Pipeline Summary Report
        if: always()
        run: |
          echo "## 🚀 DevOpsVaultX Docs — CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Description | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Checkout Repository | 🟢 Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Setup Runtime (Python 3.12) | 🟢 Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | Install Dependencies | 🟢 Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Validate & Lint Configuration | 🟢 Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Production Build | 🟢 Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | SEO, Sitemap & Link Validation | 🟢 Passed |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| 7 | Deploy to GitHub Pages | 🟢 Deployed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 7 | Deploy to GitHub Pages | ⏭️ Skipped (PR Preview) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Environments" >> $GITHUB_STEP_SUMMARY
          echo "* 🖥️ **Custom Subdomain:** [docs.devopsvaultx.com](https://docs.devopsvaultx.com/)" >> $GITHUB_STEP_SUMMARY
          echo "* 📦 **Platform Ecosystem:** [devopsvaultx.com](https://www.devopsvaultx.com/)" >> $GITHUB_STEP_SUMMARY
          echo "* 👤 **Triggered by:** \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<p align='center'>Managed automatically by DevOpsVaultX Engine &bull; Code. Deploy. Automate. Repeat. ❤️</p>" >> $GITHUB_STEP_SUMMARY
